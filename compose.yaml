name: ai-dual-target-drug-discovery
services:
  mlflow:
    build:
      context: .
      dockerfile: infra/mlflow/Dockerfile
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_db:/mlflow/db
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 25s

  audit:
    profiles: [jobs]
    build:
      context: .
      dockerfile: ml/Dockerfile.audit
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/workspace/data:ro
      - ./reports:/workspace/reports
      - ./artifacts:/workspace/artifacts
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  mlflow_db:
  mlflow_artifacts:
