
[project]
name = "ai-dual-target-drug-discovery"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "mlflow>=3.18.0",
    "numpy>=2.2,<3",
    "optuna>=5.0.0",
    "pandas>=2.2,<3",
    "pyarrow>=20,<26",
    "rdkit>=2025.3,<2027",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
dual-target = "dual_target.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]
gnn = [
    "torch==2.10.0+cu130",
    "torch-geometric==2.8.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml/src/dual_target"]
